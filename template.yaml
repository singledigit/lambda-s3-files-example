AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Code Review Agents — Two-tier event-driven architecture.
  EventBridge coordinates two Durable Function pipelines:
    DF1 (Analysis): clone → security + style agents in parallel → severity scorer
    DF2 (Remediation): Kiro headless auto-fix → test generation → executive summary
  S3 Files provides a shared POSIX workspace across all functions.

# ════════════════════════════════════════════════════════════════
# Globals
# ════════════════════════════════════════════════════════════════
Globals:
  Function:
    Runtime: python3.14
    MemorySize: 1024
    Timeout: 300
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        WORKSPACE_MOUNT: /mnt/workspace

# ════════════════════════════════════════════════════════════════
# Parameters
# ════════════════════════════════════════════════════════════════
Parameters:
  BedrockModelId:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-20250514-v1:0
    Description: Bedrock inference profile ID for the review agents

Resources:
  # ════════════════════════════════════════════════════════════════
  # Networking (nested stack)
  # ════════════════════════════════════════════════════════════════
  NetworkingStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/network.yaml

  # ════════════════════════════════════════════════════════════════
  # S3 Files (nested stack)
  # ════════════════════════════════════════════════════════════════
  S3FilesStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/s3-files.yaml
      Parameters:
        PrivateSubnetAId: !GetAtt NetworkingStack.Outputs.PrivateSubnetAId
        PrivateSubnetBId: !GetAtt NetworkingStack.Outputs.PrivateSubnetBId
        MountTargetSGId: !GetAtt NetworkingStack.Outputs.MountTargetSGId

  # ════════════════════════════════════════════════════════════════
  # API Gateway
  # Publishes review.requested event to the default EventBridge bus.
  # Returns 202 immediately.
  # ════════════════════════════════════════════════════════════════
  CodeReviewApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: CodeReviewApi
      StageName: Prod
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Code Review API
          version: '2.0'
        paths:
          /review:
            post:
              summary: Start a code review
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:events:action/PutEvents'
                credentials: !GetAtt ApiGatewayRole.Arn
                passthroughBehavior: never
                requestTemplates:
                  application/json: |
                    #set($body = $input.json('$'))
                    {
                      "Entries": [
                        {
                          "Source": "code-review.api",
                          "DetailType": "review.requested",
                          "Detail": "{\"repo_url\": $input.json('$.repo_url')}"
                        }
                      ]
                    }
                responses:
                  default:
                    statusCode: 202
                    responseTemplates:
                      application/json: |
                        {
                          "status": "ACCEPTED",
                          "message": "Code review requested. Events will coordinate the pipeline."
                        }
              responses:
                '202':
                  description: Review accepted

  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default'

  # ════════════════════════════════════════════════════════════════
  # Lambda Functions — built during demo
  # ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# Outputs
# ════════════════════════════════════════════════════════════════
Outputs:
  ApiEndpoint:
    Description: POST a repo_url here to start a review
    Value: !Sub 'https://${CodeReviewApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/review'
  WorkspaceBucketName:
    Description: S3 bucket — check {repo}/reviews/ for results
    Value: !GetAtt S3FilesStack.Outputs.WorkspaceBucketName
  FileSystemArn:
    Description: S3 Files file system ARN (for IAM policies)
    Value: !GetAtt S3FilesStack.Outputs.FileSystemArn
  AccessPointArn:
    Description: S3 Files access point ARN (for FileSystemConfigs)
    Value: !GetAtt S3FilesStack.Outputs.AccessPointArn
