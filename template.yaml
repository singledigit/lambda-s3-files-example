AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Code Review Agents — S3 Files + Durable Functions + Strands SDK.
  A durable orchestrator clones a public GitHub repo to a shared S3 Files mount,
  then two Strands-powered agents review the code in parallel.

# ════════════════════════════════════════════════════════════════
# Globals
# ════════════════════════════════════════════════════════════════
Globals:
  Function:
    Runtime: python3.13
    MemorySize: 512
    Timeout: 300
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        WORKSPACE_MOUNT: /mnt/workspace
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-arm64:18

# ════════════════════════════════════════════════════════════════
# Parameters
# ════════════════════════════════════════════════════════════════
Parameters:
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-20250514-v1:0
    Description: Bedrock inference profile ID for the review agents

Resources:
  # ════════════════════════════════════════════════════════════════
  # Networking (nested stack)
  # VPC with private subnets, NAT gateway, and security groups.
  # Lambda functions need a VPC to mount S3 Files, and a NAT
  # gateway for outbound internet access (Bedrock API, GitHub).
  # ════════════════════════════════════════════════════════════════
  NetworkingStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/network.yaml

  # ════════════════════════════════════════════════════════════════
  # S3 Files — shared workspace
  # The bucket stores the data. The file system makes it mountable.
  # The access point controls POSIX identity and creates a writable
  # root directory for Lambda (UID/GID 1000, /lambda path).
  # ════════════════════════════════════════════════════════════════

  # S3 bucket — the source of truth for all data
  WorkspaceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Required: S3 Files needs versioning enabled on the bucket
      VersioningConfiguration:
        Status: Enabled

  # IAM role that S3 Files assumes to sync data between the
  # file system and the S3 bucket. The trust policy uses the EFS
  # service principal because S3 Files is built on EFS.
  S3FilesRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3FilesAssumeRole
            Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*'
      Policies:
        - PolicyName: S3FilesBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3BucketPermissions
                Effect: Allow
                Action:
                  - s3:ListBucket*
                Resource: !GetAtt WorkspaceBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: S3ObjectPermissions
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject*
                  - s3:GetObject*
                  - s3:List*
                  - s3:PutObject*
                Resource: !Sub '${WorkspaceBucket.Arn}/*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId

  # S3 Files file system — bridges the bucket to NFS
  S3FileSystem:
    Type: AWS::S3Files::FileSystem
    Properties:
      Bucket: !GetAtt WorkspaceBucket.Arn
      RoleArn: !GetAtt S3FilesRole.Arn
      AcceptBucketWarning: true

  # Mount targets — network endpoints in each AZ so Lambda can
  # connect to the file system. One per AZ, ~5 min to create.
  MountTargetA:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      SubnetId: !GetAtt NetworkingStack.Outputs.PrivateSubnetAId
      SecurityGroups:
        - !GetAtt NetworkingStack.Outputs.MountTargetSGId

  MountTargetB:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      SubnetId: !GetAtt NetworkingStack.Outputs.PrivateSubnetBId
      SecurityGroups:
        - !GetAtt NetworkingStack.Outputs.MountTargetSGId

  # Access point — controls POSIX identity for Lambda.
  # Lambda needs UID/GID 1000:1000 and a writable root directory.
  # CreationPermissions auto-creates /lambda with the right ownership.
  S3FilesAccessPoint:
    Type: AWS::S3Files::AccessPoint
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        Path: /lambda
        CreationPermissions:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '755'

  # ════════════════════════════════════════════════════════════════
  # API Gateway
  # Uses an OpenAPI definition to invoke the durable orchestrator
  # asynchronously (X-Amz-Invocation-Type: Event). Returns 202
  # immediately — check the S3 bucket for results.
  # ════════════════════════════════════════════════════════════════
  CodeReviewApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: CodeReviewApi
      StageName: Prod
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Code Review API
          version: '1.0'
        paths:
          /review:
            post:
              summary: Start a code review
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrchestratorFunction.Alias}/invocations'
                credentials: !GetAtt ApiGatewayRole.Arn
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.X-Amz-Invocation-Type: "'Event'"
                requestTemplates:
                  application/json: |
                    {
                      "repo_url": $input.json('$.repo_url')
                    }
                responses:
                  default:
                    statusCode: 202
                    responseTemplates:
                      application/json: |
                        {
                          "status": "ACCEPTED",
                          "message": "Code review started. Check the S3 bucket for results."
                        }
              responses:
                '202':
                  description: Review accepted

  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt OrchestratorFunction.Arn
                  - !Sub '${OrchestratorFunction.Arn}:*'
                  - !Ref OrchestratorFunction.Alias

  # ════════════════════════════════════════════════════════════════
  # Lambda Functions
  # ════════════════════════════════════════════════════════════════

  # Orchestrator — durable function that coordinates the pipeline:
  #   1. Clone repo to the S3 Files mount (context.step)
  #   2. Invoke security + style agents in parallel (context.invoke)
  #   3. Write combined summary to the workspace
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - MountTargetA
      - MountTargetB
    Properties:
      FunctionName: code-review-orchestrator
      Handler: app.handler
      CodeUri: src/orchestrator/
      Timeout: 900
      DurableConfig:
        ExecutionTimeout: 3600
        RetentionPeriodInDays: 7
      AutoPublishAlias: live
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt NetworkingStack.Outputs.LambdaSGId
        SubnetIds:
          - !GetAtt NetworkingStack.Outputs.PrivateSubnetAId
          - !GetAtt NetworkingStack.Outputs.PrivateSubnetBId
      FileSystemConfigs:
        - Arn: !GetAtt S3FilesAccessPoint.AccessPointArn
          LocalMountPath: /mnt/workspace
      Environment:
        Variables:
          SECURITY_AGENT_ARN: !GetAtt SecurityAgentFunction.Arn
          STYLE_AGENT_ARN: !GetAtt StyleAgentFunction.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeAgents
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt SecurityAgentFunction.Arn
                - !Sub '${SecurityAgentFunction.Arn}:*'
                - !GetAtt StyleAgentFunction.Arn
                - !Sub '${StyleAgentFunction.Arn}:*'
            - Sid: MountS3Files
              Effect: Allow
              Action:
                - s3files:ClientMount
                - s3files:ClientWrite
                - s3files:ClientRootAccess
              Resource: !GetAtt S3FileSystem.FileSystemArn

  # Security agent — Strands agent that reads source files from the
  # mount, calls Bedrock to analyze for security issues, and writes
  # findings back to the mount. No boto3 for file access.
  SecurityAgentFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - MountTargetA
      - MountTargetB
    Properties:
      FunctionName: code-review-security-agent
      Handler: app.lambda_handler
      CodeUri: src/security_agent/
      Timeout: 600
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt NetworkingStack.Outputs.LambdaSGId
        SubnetIds:
          - !GetAtt NetworkingStack.Outputs.PrivateSubnetAId
          - !GetAtt NetworkingStack.Outputs.PrivateSubnetBId
      FileSystemConfigs:
        - Arn: !GetAtt S3FilesAccessPoint.AccessPointArn
          LocalMountPath: /mnt/workspace
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: MountS3Files
              Effect: Allow
              Action:
                - s3files:ClientMount
                - s3files:ClientWrite
                - s3files:ClientRootAccess
              Resource: !GetAtt S3FileSystem.FileSystemArn
            - Sid: InvokeBedrock
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource: '*'

  # Style agent — same pattern as security, different system prompt.
  # Reviews for code quality, naming, documentation, consistency.
  StyleAgentFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - MountTargetA
      - MountTargetB
    Properties:
      FunctionName: code-review-style-agent
      Handler: app.lambda_handler
      CodeUri: src/style_agent/
      Timeout: 600
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt NetworkingStack.Outputs.LambdaSGId
        SubnetIds:
          - !GetAtt NetworkingStack.Outputs.PrivateSubnetAId
          - !GetAtt NetworkingStack.Outputs.PrivateSubnetBId
      FileSystemConfigs:
        - Arn: !GetAtt S3FilesAccessPoint.AccessPointArn
          LocalMountPath: /mnt/workspace
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: MountS3Files
              Effect: Allow
              Action:
                - s3files:ClientMount
                - s3files:ClientWrite
                - s3files:ClientRootAccess
              Resource: !GetAtt S3FileSystem.FileSystemArn
            - Sid: InvokeBedrock
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource: '*'

# ════════════════════════════════════════════════════════════════
# Outputs
# ════════════════════════════════════════════════════════════════
Outputs:
  ApiEndpoint:
    Description: POST a repo_url here to start a review
    Value: !Sub 'https://${CodeReviewApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/review'
  WorkspaceBucketName:
    Description: S3 bucket — check {repo}/reviews/ for results
    Value: !Ref WorkspaceBucket
  S3FileSystemId:
    Description: S3 file system ID
    Value: !GetAtt S3FileSystem.FileSystemId
